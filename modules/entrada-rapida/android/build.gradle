plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.technoverse93.appdefinanza'
version = '0.1.0'

android {
  namespace "expo.modules.entradarapida"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Los tokens de sesión quedan en disco para que el widget y la ventana
  // emergente puedan escribir a Supabase sin abrir la app. Guardarlos en un
  // SharedPreferences normal los dejaría legibles ante un backup o un
  // teléfono rooteado; EncryptedSharedPreferences los cifra con una llave del
  // Android Keystore, que es la misma protección que ya usa expo-secure-store
  // del lado de JavaScript.
  implementation "androidx.security:security-crypto:1.0.0"
}
