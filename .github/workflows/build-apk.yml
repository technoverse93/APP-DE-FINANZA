name: Build Android APK

# Se compila en cada push a esta rama y en cada pull request hacia main.
# El proyecto es Expo "managed": /android no está versionado (ver .gitignore),
# así que cada corrida genera el proyecto nativo desde cero con expo prebuild.
on:
  push:
    branches:
      - claude/autonomous-git-workflow-yaa4s3
  pull_request:
    branches:
      - main

# Cancela la corrida anterior de la misma rama si llega un push nuevo antes de
# que termine, para no gastar minutos de CI en un commit ya superado.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Variables públicas que el bundle de JS necesita en tiempo de ejecución.
      # Si no hay secretos configurados en el repo, quedan vacías. Eso no
      # rompe ESTE paso (el bundling de Metro es estático, no ejecuta el
      # código), pero src/lib/supabase.ts degrada a un cliente sin operar en
      # ese caso: la app abre igual, solo las funciones que dependen de
      # Supabase quedan inactivas hasta que se configuren los secretos reales.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de GitHub trae el Android SDK preinstalado; solo hace falta
      # aceptar las licencias para que Gradle pueda usarlo sin preguntas.
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y pruebas unitarias
        run: |
          npm run typecheck
          npm test

      # Genera /android a partir de app.json y los plugins de Expo. Es el paso
      # que reemplaza al "eas build" en la nube: corre localmente en el runner.
      - name: Generar el proyecto nativo de Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # assembleDebug NO sirve para instalar el APK como app suelta: ese build
      # deja el JS fuera del paquete y el runtime intenta conectarse a Metro en
      # localhost:8081 al abrir, lo que da "Unable to load script" en cualquier
      # teléfono que no tenga el cable USB con `adb reverse` corriendo. Solo es
      # válido para desarrollo iterativo con `expo start` activo en la máquina.
      #
      # assembleRelease sí empaqueta el bundle de JS dentro del APK (tarea de
      # Gradle bundleReleaseJsAndAssets), así que arranca solo, sin Metro. El
      # release firma con el keystore de depuración por defecto (ver
      # signingConfigs.release en android/app/build.gradle tras el prebuild),
      # así que tampoco hace falta un keystore propio para este paso. Antes de
      # publicar en Play Store sí hace falta reemplazar esa firma por una
      # propia.
      - name: Compilar el APK (assembleRelease)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-de-finanza-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
